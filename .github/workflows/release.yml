name: Release Common
run-name: Release common ${{ github.ref_name }} by @${{ github.actor }}

on:
  push:
    tags:
      - '*.*.*'
      - '!*alpha*'
      - '!*beta*'

permissions:
  contents: write
  actions: read

jobs:
  release:
    if: >
      startsWith(github.ref, 'refs/tags/') &&
      !contains(github.ref_name, 'alpha') &&
      !contains(github.ref_name, 'beta') &&
      !contains(github.ref_name, '+')
    uses: ianhubnet/.github/.github/workflows/system.yml@main
    with:
      package: common
      copy_docs: true
    secrets: inherit
